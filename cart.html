<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عربة التسوق | ورد</title>

    <!-- صورة الموقع بجانب الـ Title -->
    <link rel="icon" type="image/png" href="flooer/9bcabadf15bb57733aebf1a7ebd0fb52.jpg">


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #faf7ff;
            font-family: Arial, sans-serif;
        }

        /* عنوان الصفحة */

        .cart-title {
            color: #6f4a8e;
            font-weight: bold;
        }

        .cart-title span {
            color: #c9a227;
        }


        /* كارت المنتج */

        .cart-item {
            background: white;
            border-radius: 18px;
            border: 1px solid #eee5f7;
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .cart-item:hover {
            box-shadow: 0 5px 20px rgba(111, 74, 142, 0.12);
        }

        .product-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
        }


        /* اسم المنتج */

        .product-name {
            color: #6f4a8e;
            font-weight: bold;
        }

        .product-price {
            color: #c9a227;
            font-size: 18px;
            font-weight: bold;
        }


        /* الكمية */

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            background-color: #eee5f7;
            color: #6f4a8e;
            font-size: 20px;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background-color: #d9c5e9;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }


        /* زر الحذف */

        .delete-btn {
            border: none;
            background: none;
            color: #b44b68;
            cursor: pointer;
        }


        /* ملخص الطلب */

        .summary-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid #eee5f7;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            color: #6f4a8e;
            font-weight: bold;
        }

        .summary-line {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .final-price {
            color: #c9a227;
            font-size: 24px;
            font-weight: bold;
        }


        /* زر تأكيد الطلب */

        .confirm-btn {
            background-color: #6f4a8e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            width: 100%;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .confirm-btn:hover {
            background-color: #57386f;
            color: white;
        }


        /* زر متابعة التسوق */

        .continue-btn {
            color: #6f4a8e;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .continue-btn:hover {
            color: #c9a227;
        }


        /* السلة الفارغة */

        .empty-cart {
            background: white;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            border: 1px solid #eee5f7;
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .empty-cart h3 {
            color: #6f4a8e;
        }


        /* Mobile */

        @media (max-width: 576px) {

            .product-image {
                width: 90px;
                height: 90px;
            }

            .cart-item {
                padding: 15px;
            }

            .product-name {
                font-size: 16px;
            }

            .product-price {
                font-size: 16px;
            }

            .summary-card {
                position: static;
            }
        }

    </style>
</head>


<body>

<!--
    حطي الـNavbar بتاعتك هنا
-->


<div class="container py-5">

    <!-- عنوان الصفحة -->

    <div class="text-center mb-5">

        <h1 class="cart-title">
            عربة <span>التسوق</span> 🛒
        </h1>

        <p class="text-muted">
            راجعي المنتجات قبل تأكيد طلبك
        </p>

    </div>


    <!-- محتوى السلة -->

    <div class="row g-4">

        <!-- المنتجات -->

        <div class="col-lg-8">

            <div id="cartItems"></div>

        </div>


        <!-- ملخص الطلب -->

        <div class="col-lg-4">

            <div class="summary-card">

                <h4 class="summary-title mb-4">
                    ملخص الطلب
                </h4>


                <div class="summary-line d-flex justify-content-between">

                    <span>
                        عدد المنتجات
                    </span>

                    <span id="totalItems">
                        0
                    </span>

                </div>


                <div class="summary-line d-flex justify-content-between">

                    <span>
                        سعر المنتجات
                    </span>

                    <span id="totalPrice">
                        0 ج.م
                    </span>

                </div>


                <div class="summary-line d-flex justify-content-between">

                    <span>
                        التوصيل
                    </span>

                    <span class="text-success">
                        مجاني
                    </span>

                </div>


                <div class="d-flex justify-content-between align-items-center mt-4 mb-4">

                    <span>
                        الإجمالي
                    </span>

                    <span
                        id="finalPrice"
                        class="final-price"
                    >
                        0 ج.م
                    </span>

                </div>


                <!-- تأكيد الطلب -->

                <button
                    class="confirm-btn"
                    onclick="confirmOrder()"
                >
                    تأكيد الطلب
                </button>


                <a
                    href="index.html"
                    class="continue-btn"
                >
                    ← متابعة التسوق
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    /*
        بيانات السلة

        لو عندك صفحة المنتجات بتضيف المنتجات
        إلى localStorage باسم cart
        الكود ده هيقرأها تلقائيًا.
    */

    let cart = JSON.parse(localStorage.getItem("cart")) || [];


    // عرض المنتجات

    function displayCart() {

        const cartItems = document.getElementById("cartItems");

        cartItems.innerHTML = "";


        // لو السلة فاضية

        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <div class="empty-cart-icon">
                        🌷
                    </div>

                    <h3>
                        عربة التسوق فارغة
                    </h3>

                    <p class="text-muted mt-2">
                        لم تقومي بإضافة أي باقة إلى السلة بعد
                    </p>

                    <a
                        href="red.html"
                        class="btn mt-3"
                        style="
                            background:#6f4a8e;
                            color:white;
                        "
                    >
                        تصفحي الباقات الحمراء
                    </a>

                    
                        <a
                        href="offers.html"
                        class="btn mt-3"
                        style="
                            background:#6f4a8e;
                            color:white;
                        "
                    >
                             تصفحي العروض
                    </a>


                          <a
                        href="pink.html"
                        class="btn mt-3"
                        style="
                            background:#6f4a8e;
                            color:white;
                        "
                    >
                                     تصفحي الباقات البينك
                    </a>

                          <a
                        href="purple.html"
                        class="btn mt-3"
                        style="
                            background:#6f4a8e;
                            color:white;
                        "
                    >
                                     تصفحي الباقات البيربل
                    </a>
                </div>

            `;

            updateTotal();

            return;
        }


        // عرض كل منتج

        cart.forEach((product, index) => {

            cartItems.innerHTML += `

                <div class="cart-item">

                    <div class="row align-items-center g-3">

                        <!-- صورة المنتج -->

                        <div class="col-4 col-sm-3 col-md-2">

                            <img
                                src="${product.image}"
                                class="product-image img-fluid"
                                alt="${product.name}"
                            >

                        </div>


                        <!-- بيانات المنتج -->

                        <div class="col-8 col-sm-5 col-md-4">

                            <h5 class="product-name">
                                ${product.name}
                            </h5>

                            <p class="product-price mb-2">
                                ${product.price} ج.م
                            </p>

                            <button
                                class="delete-btn"
                                onclick="removeProduct(${index})"
                            >
                                🗑 حذف
                            </button>

                        </div>


                        <!-- الكمية -->

                        <div class="col-6 col-sm-4 col-md-3">

                            <small class="text-muted d-block mb-2">
                                الكمية
                            </small>

                            <div class="quantity-box">

                                <button
                                    class="quantity-btn"
                                    onclick="increaseQuantity(${index})"
                                >
                                    +
                                </button>

                                <span class="quantity-number">
                                    ${product.quantity}
                                </span>

                                <button
                                    class="quantity-btn"
                                    onclick="decreaseQuantity(${index})"
                                >
                                    −
                                </button>

                            </div>

                        </div>


                        <!-- إجمالي المنتج -->

                        <div class="col-6 col-md-3 text-md-center">

                            <small class="text-muted d-block mb-1">
                                الإجمالي
                            </small>

                            <strong style="color:#6f4a8e;">
                                ${product.price * product.quantity}
                                ج.م
                            </strong>

                        </div>

                    </div>

                </div>

            `;

        });


        updateTotal();

    }


    // زيادة الكمية

    function increaseQuantity(index) {

        cart[index].quantity++;

        saveCart();

    }


    // تقليل الكمية

    function decreaseQuantity(index) {

        if (cart[index].quantity > 1) {

            cart[index].quantity--;

        } else {

            cart.splice(index, 1);

        }

        saveCart();

    }


    // حذف المنتج

    function removeProduct(index) {

        cart.splice(index, 1);

        saveCart();

    }


    // حفظ السلة

    function saveCart() {

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        displayCart();

    }


    // حساب الإجمالي

    function updateTotal() {

        let totalItems = 0;
        let totalPrice = 0;


        cart.forEach(product => {

            totalItems += Number(product.quantity);

            totalPrice +=
                Number(product.price) *
                Number(product.quantity);

        });


        document.getElementById("totalItems").textContent =
            totalItems;

        document.getElementById("totalPrice").textContent =
            totalPrice + " ج.م";

        document.getElementById("finalPrice").textContent =
            totalPrice + " ج.م";

    }


    // الانتقال إلى صفحة تأكيد الطلب

    function confirmOrder() {

        if (cart.length === 0) {

            alert("عربة التسوق فارغة");

            return;

        }


        window.location.href = "confirm.html";

    }



    // تشغيل الصفحة

    displayCart();

</script>
