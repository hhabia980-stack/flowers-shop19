








<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
 <title>رَوْنَقُنا | متجر الورود</title>

    <!-- صورة الموقع بجانب الـ Title -->
    <link rel="icon" type="image/png" href="flooer/9bcabadf15bb57733aebf1a7ebd0fb52.jpg">

    <title>تأكيد الشراء 🌹</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


   <style>

    body {
        background-color: #f8f4fc;
        font-family: Arial, sans-serif;
    }


    .checkout {
        max-width: 950px;
        margin: 50px auto;
    }


    .box {
        background-color: white;
        border-radius: 25px;
        padding: 35px;
        box-shadow: 0 5px 25px rgba(106, 66, 156, 0.10);
    }


    .title {
        color: #6a429c;
        font-weight: bold;
    }


    /* المنتج */

    .product-box {
        background-color: #f0eafa;
        border-radius: 20px;
        padding: 30px;
        height: 100%;
    }


    .product-image {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 20px;
    }


    .product-name {
        color: #6a429c;
        font-weight: bold;
    }


    .price {
        color: #c9a227;
        font-size: 28px;
        font-weight: bold;
    }


    .old-price {
        color: #999;
        text-decoration: line-through;
        font-size: 17px;
    }


    /* الدفع */

    .payment {
        border: 2px solid #e5dff0;
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: 0.3s;
    }


    .payment:hover {
        border-color: #c9a227;
        background-color: #faf7ef;
    }


    .payment input {
        margin-left: 10px;
    }


    .visa-box {
        display: none;
        background-color: #faf8fc;
        border-radius: 15px;
        padding: 20px;
        margin-top: 10px;
        border: 1px solid #e5dff0;
    }


    .confirm-btn {
        background-color: #6a429c;
        color: white;
        border: none;
        border-radius: 25px;
        padding: 13px;
        font-weight: bold;
        transition: 0.3s;
    }


    .confirm-btn:hover {
        background-color: #c9a227;
        color: white;
    }


    /* نجاح الطلب */

    #success {
        display: none;
        text-align: center;
        padding: 50px 20px;
    }


    .success-icon {
        font-size: 80px;
        color: #198754;
    }


    .success-title {
        color: #198754;
        font-weight: bold;
    }

.checkout-product img {
    width: 70px !important;
    height: 70px !important;
    max-width: 70px !important;
    max-height: 70px !important;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
}
</style>

</head>


<body>


<div class="container checkout">


    <div class="box">


        <!-- ================================= -->
        <!-- صفحة تأكيد الطلب -->
        <!-- ================================= -->

        <div id="checkoutPage">


            <h1 class="text-center title mb-5">

                🌹 تأكيد الطلب

            </h1>


            <div class="row g-4">


                <!-- ================================= -->
                <!-- المنتجات -->
                <!-- ================================= -->

                <div class="col-md-5">


                    <div class="product-box">


                        <h3 class="title text-center mb-4">

                            🛒 المنتجات المطلوبة

                        </h3>


                        <!-- هنا المنتجات هتظهر -->

                        <div id="checkoutProducts"></div>


                        <hr>


                        <!-- الإجمالي -->

                        <div class="d-flex justify-content-between align-items-center">

                            <strong>

                                الإجمالي

                            </strong>


                            <strong class="price">

                                <span id="totalPrice">

                                    0

                                </span>

                                جنيه

                            </strong>

                        </div>


                    </div>


                </div>



                <!-- ================================= -->
                <!-- بيانات العميل -->
                <!-- ================================= -->

                <div class="col-md-7">


                    <form id="orderForm">


                        <h4 class="title mb-3">

                            بيانات العميل

                        </h4>



                        <!-- الاسم -->

                        <div class="mb-3">

                            <label class="form-label">

                                الاسم بالكامل

                            </label>


                            <input type="text"
                                   class="form-control"
                                   placeholder="اكتب اسمك"
                                   required>

                        </div>



                        <!-- الهاتف -->

                        <div class="mb-3">

                            <label class="form-label">

                                رقم الهاتف

                            </label>


                            <input type="tel"
                                   class="form-control"
                                   placeholder="01xxxxxxxxx"
                                   required>

                        </div>



                        <!-- العنوان -->

                        <div class="mb-4">

                            <label class="form-label">

                                عنوان التوصيل

                            </label>


                            <textarea class="form-control"
                                      rows="3"
                                      placeholder="اكتب عنوان التوصيل"
                                      required></textarea>

                        </div>



                        <!-- ================================= -->
                        <!-- طريقة الدفع -->
                        <!-- ================================= -->

                        <h4 class="title mb-3">

                            💳 طريقة الدفع

                        </h4>



                        <!-- الدفع أونلاين -->

                        <label class="payment d-block">


                            <input type="radio"
                                   name="payment"
                                   value="online"
                                   onclick="paymentType('online')"
                                   required>


                            <i class="bi bi-wallet2"></i>


                            الدفع أونلاين


                        </label>



                        <!-- الدفع بالفيزا -->

                        <label class="payment d-block">


                            <input type="radio"
                                   name="payment"
                                   value="visa"
                                   onclick="paymentType('visa')">


                            <i class="bi bi-credit-card"></i>


                            الدفع بالفيزا


                        </label>



                        <!-- ================================= -->
                        <!-- بيانات الفيزا -->
                        <!-- ================================= -->

                        <div id="visaBox"
                             class="visa-box">


                            <h6 class="title">

                                بيانات البطاقة

                            </h6>



                            <div class="mb-3">

                                <label class="form-label">

                                    اسم صاحب البطاقة

                                </label>


                                <input type="text"
                                       class="form-control"
                                       placeholder="اسم صاحب البطاقة">

                            </div>



                            <div class="mb-3">

                                <label class="form-label">

                                    رقم البطاقة

                                </label>


                                <input type="text"
                                       class="form-control"
                                       placeholder="XXXX XXXX XXXX XXXX">

                            </div>



                            <div class="row">


                                <div class="col-6">

                                    <label class="form-label">

                                        تاريخ الانتهاء

                                    </label>


                                    <input type="text"
                                           class="form-control"
                                           placeholder="MM/YY">

                                </div>



                                <div class="col-6">

                                    <label class="form-label">

                                        CVV

                                    </label>


                                    <input type="password"
                                           class="form-control"
                                           placeholder="***">

                                </div>


                            </div>


                        </div>



                        <hr class="my-4">



                        <!-- ================================= -->
                        <!-- الإجمالي -->
                        <!-- ================================= -->

                        <div class="d-flex justify-content-between mb-4">


                            <strong>

                                الإجمالي النهائي

                            </strong>


                            <strong class="price">


                                <span id="totalPrice2">

                                    0

                                </span>


                                جنيه


                            </strong>


                        </div>



                        <!-- ================================= -->
                        <!-- تأكيد -->
                        <!-- ================================= -->

                        <button type="submit"
                                class="btn confirm-btn w-100">


                            <i class="bi bi-check-circle"></i>


                            تأكيد الشراء


                        </button>


                    </form>


                </div>


            </div>


        </div>



        <!-- ================================= -->
        <!-- نجاح الطلب -->
        <!-- ================================= -->

        <div id="success">


            <div class="success-icon">

                <i class="bi bi-check-circle-fill"></i>

            </div>


            <h1 class="success-title mt-3">

                تم الشراء بنجاح 🎉

            </h1>


            <p class="text-muted">

                شكرًا لطلبك ❤️

            </p>


            <div class="product-box mt-4">


                <h4>

                    تم تأكيد طلبك بنجاح

                </h4>


                <h5 class="mt-3">

                    عدد المنتجات:

                    <span id="successProducts">

                        0

                    </span>

                </h5>


                <h3 class="price mt-3">


                    الإجمالي:


                    <span id="successPrice">

                        0

                    </span>


                    جنيه


                </h3>


            </div>



            <a href="index.html"
               class="btn confirm-btn mt-4 px-5">


                العودة للرئيسية


            </a>


        </div>


    </div>


</div>



<script>


// ==================================================
// قراءة العربة من localStorage
// ==================================================
// قراءة بيانات المنتج من الرابط
const params = new URLSearchParams(window.location.search);

const product = params.get("product");
const price = params.get("price");
const image = params.get("image");

// إنشاء العربة
let cart = [];

// لو جاي منتج من زر اشتري الآن
if (product && price) {

    cart = [{
        name: product,
        price: Number(price),
        quantity: 1,
        image: image || "assets/images/default.jpg"
    }];

} else {

    // لو الصفحة مفتوحة من العربة
    cart = JSON.parse(localStorage.getItem("cart")) || [];

}

// لو مفيش منتجات
if (cart.length === 0) {

    alert("عربة التسوق فارغة");

    window.location.href = "index.html";

}


// ==================================================
// عرض المنتجات
// ==================================================

const checkoutProducts =
    document.getElementById("checkoutProducts");


let productsHTML = "";


// الإجمالي
let total = 0;


// ==================================================
// المرور على كل المنتجات
// ==================================================

cart.forEach(function(item) {


    // سعر المنتج × الكمية

    let itemTotal =
        Number(item.price) * Number(item.quantity);


    // إضافة للإجمالي

    total += itemTotal;


    // إضافة المنتج للصفحة

    productsHTML += `

        <div class="checkout-product">

            <div class="d-flex align-items-center">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="me-3">

                    <h5 class="mb-2">

                        ${item.name}

                    </h5>

                    <p class="mb-1">

                        السعر:
                        ${item.price}
                        جنيه

                    </p>

                    <p class="mb-1">

                        الكمية:
                        ${item.quantity}

                    </p>

                    <strong class="price">

                        ${itemTotal}
                        جنيه

                    </strong>

                </div>

            </div>

        </div>

    `;

});


// ==================================================
// وضع المنتجات في الصفحة
// ==================================================

checkoutProducts.innerHTML =
    productsHTML;


// ==================================================
// عرض الإجمالي
// ==================================================

document.getElementById("totalPrice")
    .textContent = total;


document.getElementById("totalPrice2")
    .textContent = total;


// ==================================================
// اختيار طريقة الدفع
// ==================================================

function paymentType(type) {


    const visaBox =
        document.getElementById("visaBox");


    if (type === "visa") {

        visaBox.style.display = "block";

    } else {

        visaBox.style.display = "none";

    }

}


// ==================================================
// تأكيد الطلب
// ==================================================

document.getElementById("orderForm")
    .addEventListener("submit", function(e) {


        e.preventDefault();


        // إخفاء صفحة التأكيد

        document.getElementById("checkoutPage")
            .style.display = "none";


        // إظهار صفحة النجاح

        document.getElementById("success")
            .style.display = "block";


        // عدد المنتجات

        document.getElementById("successProducts")
            .textContent = cart.length;


        // الإجمالي

        document.getElementById("successPrice")
            .textContent = total;


        // تفريغ العربة بعد إتمام الطلب

        localStorage.removeItem("cart");

    });


</script>


</body>

</html>
